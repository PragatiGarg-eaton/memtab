---
name: 'run precommit hooks'

on:
  pull_request:

permissions:
  contents: read

jobs:
  precommit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: j178/prek-action@v2
